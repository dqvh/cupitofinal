<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cupito — Reservas online para tu negocio</title>
    <meta name="description" content="Cupito: reservas online con seña, recordatorios automáticos y página propia para barberías, estética, clínicas y más." />
    <meta name="theme-color" content="#082b22" />
    <!-- Preview al compartir el link por WhatsApp / Instagram / redes -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cupito" />
    <meta property="og:title" content="Cupito — Reservas online para tu negocio" />
    <meta property="og:description" content="Tu link propio de reservas: servicios, seña, recordatorios y lista de espera. Sin llamadas, sin apps." />
    <meta property="og:image" content="https://cupito.app/logo.png" />
    <meta property="og:url" content="https://cupito.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cupito — Reservas online para tu negocio" />
    <meta name="twitter:description" content="Tu link propio de reservas: servicios, seña, recordatorios y lista de espera." />
    <meta name="twitter:image" content="https://cupito.app/logo.png" />
    <link rel="canonical" href="https://cupito.app/" />
    <link rel="preload" as="image" href="/cupito-logo.webp" type="image/webp" fetchpriority="high" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cupito" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://cupito.app/#app",
            "name": "Cupito",
            "url": "https://cupito.app/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "All",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "ARS"
            },
            "description": "Plataforma de gestión de reservas, turnos online, señas y recordatorios automáticos para negocios y profesionales independientes."
          },
          {
            "@type": "Organization",
            "@id": "https://cupito.app/#organization",
            "name": "Cupito",
            "url": "https://cupito.app/",
            "logo": "https://cupito.app/cupito-logo.png",
            "sameAs": [
              "https://www.instagram.com/cupitoapp"
            ]
          }
        ]
      }
    </script>
    <style>html{background:#f8faf9}body{font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}</style>
    <style>html[data-app-route] #root[data-prerender]{visibility:hidden}</style>
    <script>
      // Evita mostrar la portada durante la carga de una reserva o del panel.
      var route = location.hash.startsWith('#/') ? location.hash.slice(2).split('?')[0] : location.pathname.slice(1);
      if (route && !['precios','problema','solucion','reservar','faq','terms','privacy','terminos','privacidad'].includes(route)) document.documentElement.dataset.appRoute = 'true';
      window.addEventListener('vite:preloadError', function (event) {
        try {
          if (!sessionStorage.getItem('cupito_chunk_retry')) {
            sessionStorage.setItem('cupito_chunk_retry', '1');
            event.preventDefault();
            location.reload();
          }
        } catch (_) {}
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
